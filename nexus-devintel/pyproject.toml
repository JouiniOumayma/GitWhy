[project]
name = "nexus-devintel"
version = "0.1.0"
description = "Knowledge Graph (Neo4j) over a real GitHub repository for Change Impact Analysis and Root Cause Analysis"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.8,<3",
    "neo4j>=5.24,<6",
    "psycopg[binary]>=3.1,<4",
    "PyYAML>=6.0,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning"]
