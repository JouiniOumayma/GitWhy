# NEXUS-DevIntel — CI
#
# Runs the full test suite on every push and pull request.
# The unit tests are written mock-first (no live Neo4j/PostgreSQL needed);
# only the one live-stack check is skipped when NEXUS_LIVE_STACK is unset.
#
# Phase 3 will add the agents' LLM calls behind mocks: MISTRAL_API_KEY is
# therefore never required in CI (and should stay a secret if ever needed).

name: ci
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest
